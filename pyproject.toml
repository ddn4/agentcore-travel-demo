[project]
name = "agentcore-travel-demo"
version = "0.1.0"
description = "Travel concierge: Strands agents on Temporal, run locally and on Amazon Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = [
  "temporalio[strands-agents,pydantic]>=1.34,<2",
  "strands-agents>=1.53,<2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls Duffel and Google with real test keys"]
addopts = "-m 'not live'"
